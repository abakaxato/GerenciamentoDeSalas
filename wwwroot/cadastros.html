<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missões de Amor - Cadastros</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Missões de Amor</h1>
        <p>Gerenciamento de Entidades</p>
    </header>
    <nav>
        <a href="index.html">Agenda Principal</a>
        <a href="cadastros.html">Cadastros</a>
        <a href="Agendar.html">Novo Agendamento</a>
        <a href="painel.html">Painel TV</a>
    </nav>
    <div class="container" style="border-top-color: var(--vermelho);">
        <div class="tabs">
            <div class="tab active" onclick="showTab('responsavel', this)">Responsável</div>
            <div class="tab" onclick="showTab('paciente', this)">Paciente</div>
            <div class="tab" onclick="showTab('profissional', this)">Profissional</div>
            <div class="tab" onclick="showTab('sala', this)">Sala</div>
        </div>

        <div id="responsavel" class="form-section active">
            <h2>Cadastrar Responsável</h2>
            <form onsubmit="salvar(event, 'responsaveis')">
                <div class="form-group"><label>Nome</label><input type="text" id="respNome" required></div>
                <div class="form-group"><label>Telefone</label><input type="text" id="respTelefone" placeholder="(81) 99999-9999" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="respEmail"></div>
                <button type="submit">Salvar Responsável</button>
            </form>
        </div>

        <div id="paciente" class="form-section">
            <h2>Cadastrar Paciente</h2>
            <form onsubmit="salvar(event, 'pacientes')">
                <div class="form-group"><label>Nome do Paciente</label><input type="text" id="pacNome" required></div>
                <div class="form-group"><label>Data de Nascimento</label><input type="date" id="pacDataNasc"></div>
                <div class="form-group"><label>ID do Responsável</label><input type="number" id="pacRespId" required></div>
                <button type="submit">Salvar Paciente</button>
            </form>
        </div>

        <div id="profissional" class="form-section">
            <h2>Cadastrar Profissional</h2>
            <form onsubmit="salvar(event, 'profissionais')">
                <div class="form-group"><label>Nome</label><input type="text" id="profNome" required></div>
                <div class="form-group"><label>Especialidade</label><input type="text" id="profEsp" required></div>
                <div class="form-group"><label>Telefone</label><input type="text" id="profTelefone"></div>
                <button type="submit">Salvar Profissional</button>
            </form>
        </div>

        <div id="sala" class="form-section">
            <h2>Cadastrar Sala</h2>
            <form onsubmit="salvar(event, 'salas')">
                <div class="form-group"><label>Nome da Sala</label><input type="text" id="salaNome" required></div>
                <div class="form-group"><label>Capacidade</label><input type="number" id="salaCapacidade" value="1" min="1"></div>
                <button type="submit">Salvar Sala</button>
            </form>
        </div>
    </div>
    <script src="js/cadastros.js"></script>
</body>
</html>
