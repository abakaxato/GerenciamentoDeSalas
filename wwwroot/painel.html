<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV - Missões de Amor</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Ajustes específicos para exibição em TV */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .painel-container {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
        }

        .coluna {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

            .coluna h2 {
                color: var(--azul);
                font-size: 2rem;
                text-align: center;
                margin-bottom: 1rem;
                text-transform: uppercase;
                border-bottom: 4px solid var(--verde);
                padding-bottom: 0.5rem;
            }

        .card.atual {
            border-left-color: var(--vermelho);
            background-color: #fff5f5;
            transform: scale(1.02);
        }

            .card.atual .horario {
                color: var(--vermelho);
            }

        .paciente {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .detalhes {
            font-size: 1.2rem;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>Missões de Amor - Painel de Atendimento</h1>
    </header>
    <div class="painel-container">
        <div class="coluna">
            <h2>Em Atendimento</h2>
            <div id="em-atendimento"></div>
        </div>
        <div class="coluna">
            <h2>Próximos Chamados</h2>
            <div id="proximos-atendimentos"></div>
        </div>
    </div>
    <script src="js/painel.js"></script>
</body>
</html>
